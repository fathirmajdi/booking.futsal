<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Lapangan Futsal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="user-page" class="container">
        <h1>Booking Futsal</h1>
        <div class="booking-form">
            <input type="text" id="nama" placeholder="Nama Pemesan">
            <input type="tel" id="hp" placeholder="Nomor WhatsApp (Contoh: 0812...)">
            <input type="date" id="tanggal">
            <select id="jam">
                <option value="08:00 - 09:00">08:00 - 09:00</option>
                <option value="09:00 - 10:00">09:00 - 10:00</option>
                <option value="19:00 - 20:00">19:00 - 20:00</option>
                <option value="20:00 - 21:00">20:00 - 21:00</option>
            </select>
            
            <div class="info-box">
                <strong>Penting:</strong> Transfer DP Rp 5.000 ke QRIS di bawah, lalu upload foto bukti.
            </div>
            
            <input type="file" id="bukti">
            
            <button type="button" onclick="tambahBooking()">KIRIM & BOOKING SEKARANG</button>
        </div>

        <div class="qris-section" style="text-align:center; margin-top:15px;">
            <p>Scan QRIS DP 5rb:</p>
            <img src="qris.jpg" width="180" style="border: 2px solid #ddd; border-radius: 10px;">
        </div>

        <h3>Jadwal Terisi</h3>
        <table>
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Tanggal</th>
                    <th>Jam</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="listData"></tbody>
        </table>
        
        <p class="login-owner-link" onclick="loginOwner()">Login Owner</p>
    </div>

    <div id="admin-page" class="container admin-wide" style="display:none;">
        <h1>Dashboard Owner</h1>
        <button onclick="location.reload()" style="background:#e74c3c; width: 100px;">Keluar</button>
        <table>
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>WhatsApp</th>
                    <th>Tanggal</th>
                    <th>Jam</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="listAdmin"></tbody>
        </table>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
