<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Booking Futsal - Final Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="user-page" class="container">
        <h1>Booking Lapangan</h1>
        
        <div class="booking-form">
            <label>Informasi Pelanggan</label>
            <input type="text" id="nama" placeholder="Nama Lengkap">
            <input type="tel" id="hp" placeholder="Nomor WhatsApp">
            
            <label>Jadwal Main</label>
            <input type="date" id="tanggal">
            <select id="jam">
                <option value="19:00 - 20:00">19:00 - 20:00</option>
                <option value="20:00 - 21:00">20:00 - 21:00</option>
                <option value="21:00 - 22:00">21:00 - 22:00</option>
            </select>
            
            <div class="info-box">
                <strong>Instruksi Pembayaran:</strong><br>
                1. Scan QRIS DANA di bawah ini.<br>
                2. Bayar DP sebesar Rp 5.000.<br>
                3. Screenshot & upload bukti transfer.
            </div>

            <div class="qris-section" style="text-align:center;">
                <p>QRIS DANA Pembayaran:</p>
                <img src="qris.jpg" alt="QRIS DANA" id="qris-img">
            </div>

            <label>Upload Bukti Pembayaran</label>
            <input type="file" id="bukti" accept="image/*">
            
            <button type="button" onclick="tambahBooking()" id="btn-booking">KIRIM & BOOKING SEKARANG</button>
        </div>

        <h3>Jadwal Terisi</h3>
        <table>
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Tanggal</th>
                    <th>Jam</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="listData"></tbody>
        </table>
        
        <span class="login-owner-link" onclick="loginOwner()">Panel Owner</span>
    </div>

    <div id="admin-page" class="container admin-wide" style="display:none;">
        <h1>Dashboard Manajemen Owner</h1>
        <button onclick="location.reload()" class="btn-logout">Keluar Sistem</button>
        
        <table>
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>WhatsApp</th>
                    <th>Tanggal/Jam</th>
                    <th>Bukti DP</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="listAdmin"></tbody>
        </table>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
